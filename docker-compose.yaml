services:
  # ═══════════════════════════════════════════════════════════
  # db — MySQL 8.0
  # ═══════════════════════════════════════════════════════════
  db:
    image: mysql:8.0.46
    container_name: pipette_new_db
    restart: unless-stopped
    stop_grace_period: 60s
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: Seno16/1978S
      MYSQL_DATABASE: pipette
      MYSQL_USER: pipette
      MYSQL_PASSWORD: Seno16/1978S
      TZ: Asia/Krasnoyarsk
    volumes:
      - ./mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ═══════════════════════════════════════════════════════════
  # app — Node.js приложение
  # ═══════════════════════════════════════════════════════════
  app:
    build: .
    container_name: pipette_new_app
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - ./help-defaults:/app/frontend/help-defaults
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: Asia/Krasnoyarsk
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: pipette
      DB_USER: pipette
      DB_PASSWORD: Seno16/1978S
      JWT_SECRET: 7f3a9c2e8b1d4f6a0e5c7b9d2f4a6c8e1b3d5f7a9c2e4b6d8f0a1c3e5b7d9f2a
      AUDIT_LOG_RETENTION_DAYS: "365"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ═══════════════════════════════════════════════════════════
  # nginx — HTTPS-терминация + reverse proxy
  # ═══════════════════════════════════════════════════════════
  nginx:
    image: nginx:1.31-alpine
    container_name: pipette_new_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/pipette.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
